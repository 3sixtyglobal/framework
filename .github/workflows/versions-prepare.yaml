name: Versions Prepare

# GHA_RELEASE_TOKEN requires:
#   contents:      read/write
#   pull-requests: read/write

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Which type of versions prepare run to create'
        required: true
        type: choice
        options:
          - '🚧 prerelease (next branch)'
          - '🔧 patch (main branch)'
          - '✨ minor (main branch)'
          - '🚀 major (main branch)'

jobs:
  prepare:
    name: Prepare Versions
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Set target branch
        id: set-branch
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.releaseType }}"

          if [[ "$INPUT" == *"prerelease"* ]]; then
            BRANCH="next"
          elif [[ "$INPUT" == *"patch"* ]] || [[ "$INPUT" == *"minor"* ]] || [[ "$INPUT" == *"major"* ]]; then
            BRANCH="main"
          else
            echo "::error::Unrecognized release type: $INPUT"
            exit 1
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Using branch: $BRANCH"

      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Versions Prepare
        uses: ./.github/workflows/versions-prepare
        with:
          branch: ${{ steps.set-branch.outputs.branch }}
          gpg_private_key: ${{ secrets.TWIN_GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.TWIN_GPG_KEY_ID }}
          test_env_vars: ${{ secrets.TWIN_TEST_ENV_VARS }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}
