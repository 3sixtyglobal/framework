name: Docs Update

on:
  # Manual-only workflow for controlled docs refreshes.
  # Tip: run with dryRun=true first to inspect changes before writing to next.
  workflow_dispatch:
    inputs:
      dryRun:
        # When true, docs are generated and diffs are printed, but no commit is created.
        description: 'Run docs generation and report changes without committing'
        required: true
        default: false
        type: boolean

# Prevent multiple docs jobs from racing on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed to create commits and push them back to next.
permissions:
  contents: write

jobs:
  discover-workspaces:
    runs-on: 'ubuntu-latest'
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}

    steps:
      # Safety guard: docs updates are only allowed on the next branch.
      - name: Enforce next branch
        run: |
          if [ "${{ github.ref_name }}" != "next" ]; then
            echo "This workflow only runs on the next branch."
            exit 1
          fi

      # Checkout next explicitly so workspace discovery reads the expected package.json.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: next

      # Use root package.json workspaces directly for the matrix.
      - name: Resolve workspace matrix
        id: workspaces
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `workspaces=${JSON.stringify(rootPkg.workspaces)}\n`);
          console.log(`Using ${rootPkg.workspaces.length} workspaces from package.json.`);
          console.log(rootPkg.workspaces.join("\n"));
          NODE

  generate-docs:
    needs: discover-workspaces
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        workspace: ${{ fromJson(needs.discover-workspaces.outputs.workspaces) }}

    steps:
      # Safety guard: docs updates are only allowed on the next branch.
      - name: Enforce next branch
        run: |
          if [ "${{ github.ref_name }}" != "next" ]; then
            echo "This workflow only runs on the next branch."
            exit 1
          fi

      # Checkout next explicitly so commits always target the correct branch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: next

      # Use the same Node runtime as other CI workflows in this repo.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install dependencies once at repo root for workspace docs generation.
      - name: Install dependencies
        run: |
          for i in {1..3}; do
            npm ci && break || {
              if [ $i -eq 3 ]; then
                echo "npm ci failed after 3 attempts"
                exit 1
              fi
              echo "npm ci failed, retrying in 30 seconds (attempt $i/3)..."
              sleep 30
            }
          done

      # Build each workspace before docs so generated API references reflect current build output.
      - name: Build workspace
        run: |
          npm run build --workspace ${{ matrix.workspace }}

      # Generate docs for this workspace matrix entry.
      - name: Generate package docs
        run: |
          npm run docs --workspace ${{ matrix.workspace }}

      # Persist each workspace diff as a patch for final aggregation in one commit.
      - name: Create patch artifact
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation updates for ${{ matrix.workspace }}."
            exit 0
          fi

          patch_name="$(echo "${{ matrix.workspace }}" | tr '/' '-')"
          mkdir -p patches
          git diff --cached --binary > "patches/${patch_name}.patch"

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-patch-${{ strategy.job-index }}
          path: patches/*.patch
          if-no-files-found: ignore

  commit-docs:
    needs:
      - discover-workspaces
      - generate-docs
    runs-on: 'ubuntu-latest'
    steps:
      # Safety guard: docs updates are only allowed on the next branch.
      - name: Enforce next branch
        run: |
          if [ "${{ github.ref_name }}" != "next" ]; then
            echo "This workflow only runs on the next branch."
            exit 1
          fi

      # Checkout next explicitly so commits always target the correct branch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: next

      - name: Download patch artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: docs-patch-*
          merge-multiple: true
          path: .patches

      - name: Apply workspace patches
        run: |
          if [ ! -d .patches ]; then
            echo "No patch artifacts found."
            exit 0
          fi

          shopt -s nullglob
          patches=(.patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patch files to apply."
            exit 0
          fi

          for patch in "${patches[@]}"; do
            echo "Applying ${patch}"
            git apply --index --whitespace=nowarn "$patch"
          done

      # Create one repo-wide commit and push only when docs changed.
      - name: Report docs change status
        run: |
          if git diff --cached --quiet; then
            echo "No documentation changes were generated."
            exit 0
          fi

          echo "Documentation changes detected."
          git status --short
          git diff --cached --name-only

      # Commit/push is disabled during dry-run mode.
      - name: Commit and push docs update
        if: ${{ !inputs.dryRun }}
        run: |
          # Configure bot identity so audit trail is explicit in git history.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No documentation updates to commit."
            exit 0
          fi

          # Single conventional commit for all docs changes, then push directly to next.
          git commit -m "docs: update" --signoff
          git push origin HEAD:next

      - name: Dry run summary
        if: ${{ inputs.dryRun }}
        run: |
          echo "Dry run enabled: no commit or push performed."
