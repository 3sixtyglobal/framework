packages:
  - 'packages/*'
  - 'apps/*'

# Intra-repo dependencies are pinned to exact versions instead of the workspace:
# protocol, so pnpm has to be told to resolve them from the workspace.
linkWorkspacePackages: true
preferWorkspacePackages: true

# Every dependency in the repo is pinned to an exact version.
saveExact: true

allowBuilds:
  esbuild: true
  unrs-resolver: true
